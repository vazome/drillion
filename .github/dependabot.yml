version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    # Monaco only works as one exact-version set that monaco-languageclient chooses, pinned
    # again in web/pnpm-workspace.yaml overrides, which Dependabot does not edit. Bump by hand.
    ignore:
      - dependency-name: "@codingame/*"
      - dependency-name: "monaco-languageclient"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
