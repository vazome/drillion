name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests -q
      - run: uv run drillion selfcheck
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - name: locate the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path)" >> "$GITHUB_ENV"
        working-directory: web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm build
        working-directory: web
      # after pnpm install, with node_modules on disk: the only state the sdist exclude list can fail in
      - run: uv build --sdist -o /tmp/sdist
      - name: the sdist carries the source, not the workspace
        run: |
          python3 - <<'PY'
          import glob, sys, tarfile
          names = [m.name for m in tarfile.open(glob.glob("/tmp/sdist/*.tar.gz")[0]).getmembers()]
          banned = [n for n in names
                    if any(b in n for b in ("node_modules", ".tsbuildinfo", "/screenshots/",
                                            "/test-results/", "/.vscode/", "/.idea/"))]
          if banned:
              print(f"::error::the sdist contains {len(banned)} files it should not, e.g. {banned[:3]}")
              sys.exit(1)
          tasks = {n.split("/")[2] for n in names if "/tasks/" in n and n.count("/") > 2}
          if len(tasks) != 171:
              print(f"::error::the sdist carries {len(tasks)} task folders, expected 171")
              sys.exit(1)
          if not any("/web/dist/" in n for n in names):
              print("::error::the sdist has no web/dist, so a wheel built from it serves no page")
              sys.exit(1)
          print(f"sdist ok: {len(names)} entries, {len(tasks)} tasks, web/dist present")
          PY
        working-directory: web

  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # this image tag and web/package.json's @playwright/test pin are one version, bumped together
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm screens
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: client-screenshots
          path: web/screenshots/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: client-traces
          path: web/test-results/

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: drillion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: start the image
        run: >
          docker run -d --name drillion
          --user "$(id -u):$(id -g)"
          -v "$PWD:/data"
          -p 127.0.0.1:8765:8765
          drillion:ci
      - name: wait for healthy
        run: |
          for _ in $(seq 30); do
            case "$(docker inspect -f '{{.State.Health.Status}}' drillion)" in
              healthy) exit 0 ;;
              unhealthy) break ;;
            esac
            sleep 2
          done
          echo "::error::the container never reported healthy"
          docker logs drillion
          exit 1
      - run: docker exec drillion drillion selfcheck
      - name: start it again with nothing but a volume
        run: |
          docker rm -f drillion
          docker run -d --name seeded -v drillion-data:/data -p 127.0.0.1:8765:8765 drillion:ci
          for _ in $(seq 30); do
            case "$(docker inspect -f '{{.State.Health.Status}}' seeded)" in
              healthy) break ;;
              unhealthy) docker logs seeded; exit 1 ;;
            esac
            sleep 2
          done
          test "$(curl -fsS http://127.0.0.1:8765/api/health | jq .tasks)" = 171
          curl -fsS -o /dev/null http://127.0.0.1:8765/
          curl -fsS -o /dev/null -X POST http://127.0.0.1:8765/api/task/001_fstrings/open
