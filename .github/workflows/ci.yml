name: ci

# push builds main; pull_request builds everything else. Listing both events bare
# ran the whole job twice for every in-repo pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read          # the job reads the checkout and nothing else

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # the checks take a couple of minutes; this is a hang detector, not a budget
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest tests -q
      - run: uv run drillion selfcheck
      # the page is real code now: `pnpm build` is `tsc -b && vite build`, so this is the
      # type check too. Node and pnpm come in the same way the Dockerfile's web stage gets them.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
