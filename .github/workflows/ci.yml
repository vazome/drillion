name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # nightly: the 14 tasks that import boto3, moto, requests, responses, langchain-core,
    # fastapi and httpx at grade time can break on an upstream release with no commit landing
    # here to trigger CI. Offset from security.yml (17 6 * * 1) and scorecard.yml (41 6 * * 1),
    # and off the hour, where GitHub's scheduler is congested and runs get delayed.
    - cron: "37 3 * * *"

permissions:
  contents: read

concurrency:
  # github.ref is the same default-branch ref for a push to main and every scheduled run, so
  # without this a nightly run and a just-landed push could cancel each other out
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

jobs:
  # a prose commit does not need three operating systems, a Playwright suite and a container
  # build to prove it is still prose. Four of the last thirteen merged PRs changed nothing but
  # documentation and each ran the lot, twice -- once on the PR and once on the merge.
  #
  # The filter is a deny-list inverted on purpose: anything this does not recognise as prose is
  # code, so a new directory runs the full matrix until someone decides otherwise. Note
  # `README.md$` is anchored, because `tasks/*/README.md` is a task definition the catalogue and
  # doctor suites validate -- it is content, not documentation.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # both ends of the diff have to be in the clone
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          docs='^(docs/|\.github/ISSUE_TEMPLATE/|\.github/pull_request_template\.md$'
          docs="$docs"'|README\.md$|CONTRIBUTING\.md$|CHANGELOG\.md$|AGENTS\.md$|CLAUDE\.md$'
          docs="$docs"'|CONTEXT\.md$|DESIGN\.md$|SECURITY\.md$|NOTICE$|LICENSE$)'
          # no BASE means this is not a pull request -- a push or the nightly always runs everything
          if [ -z "$BASE" ] || git diff --name-only "$BASE" "$HEAD" | grep -qvE "$docs"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "documentation only: skipping the matrix, the client and the image" >> "$GITHUB_STEP_SUMMARY"
          fi

  # the README sells uvx / uv tool install / pip on "Python 3.13 or newer", so Windows and
  # macOS are advertised platforms: settings._data_home() picks where progress.json lives
  # from sys.platform, and only its Linux branch had ever been executed
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: check (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # three OS on the pinned interpreter plus one cell on the next series; a full 3x2
        # buys little, because uv.lock carries no python_full_version markers and so
        # resolves the same packages on both
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }} # sets UV_PYTHON, which wins over .python-version
      - run: uv sync --locked
        if: github.event_name != 'schedule'
      # --locked pins every package to the lockfile, so a push or PR run install the exact
      # same versions every time; that's reproducible, but it's also blind to the upstream
      # release that broke a task overnight, which is the entire point of running this nightly
      - name: resolve today's allowed versions instead of the lockfile
        if: github.event_name == 'schedule'
        run: uv lock --upgrade && uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests -q
      - run: uv run drillion selfcheck

  # Linux-only on purpose: this builds the client and checks the sdist, neither of which
  # is what the install paths above promise per-OS
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - name: locate the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path)" >> "$GITHUB_ENV"
        working-directory: web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm build
        working-directory: web
      # after pnpm install, with node_modules on disk: the only state the sdist exclude list can fail in
      - run: uv build --sdist -o /tmp/sdist
      - name: the sdist carries the source, not the workspace
        run: |
          python3 - <<'PY'
          import glob, sys, tarfile
          names = [m.name for m in tarfile.open(glob.glob("/tmp/sdist/*.tar.gz")[0]).getmembers()]
          banned = [n for n in names
                    if any(b in n for b in ("node_modules", ".tsbuildinfo", "/screenshots/",
                                            "/test-results/", "/.vscode/", "/.idea/"))]
          if banned:
              print(f"::error::the sdist contains {len(banned)} files it should not, e.g. {banned[:3]}")
              sys.exit(1)
          tasks = {n.split("/")[2] for n in names if "/tasks/" in n and n.count("/") > 2}
          if len(tasks) != 182:
              print(f"::error::the sdist carries {len(tasks)} task folders, expected 182")
              sys.exit(1)
          if not any("/web/dist/" in n for n in names):
              print("::error::the sdist has no web/dist, so a wheel built from it serves no page")
              sys.exit(1)
          print(f"sdist ok: {len(names)} entries, {len(tasks)} tasks, web/dist present")
          PY
        working-directory: web

  screens:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # this image tag and web/package.json's @playwright/test pin are one version, bumped together
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm screens
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: client-screenshots
          path: web/screenshots/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: client-traces
          path: web/test-results/

  # builds the image once and is the only place that does. Everything that needs the built
  # image -- the smoke tests below and the vulnerability scan that used to live in
  # security.yml -- hangs off this one build, because two workflows each spending a minute
  # building the same Dockerfile from the same commit bought nothing but a second copy.
  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # the scan below publishes to code scanning
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: drillion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # the OS layer and everything vendored into the venv: the surface nothing else looks at.
      # Ahead of the smoke tests on purpose -- a broken image is still an image whose CVEs we
      # want on record, and a failing smoke test below must not swallow the upload.
      - name: scan the image we would publish
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: drillion:ci
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: 0
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      # reports, does not gate: the database moves, so the same commit goes green and red on
      # different days. Flip exit-code to 1 once the baseline is agreed and driven down.
      - name: the fixable CRITICAL and HIGH in the image today
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: drillion:ci
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 0
          skip-setup-trivy: true

      - name: start the image
        run: >
          docker run -d --name drillion
          --user "$(id -u):$(id -g)"
          -v "$PWD:/data"
          -p 127.0.0.1:8765:8765
          drillion:ci
      - name: wait for healthy
        run: |
          for _ in $(seq 30); do
            case "$(docker inspect -f '{{.State.Health.Status}}' drillion)" in
              healthy) exit 0 ;;
              unhealthy) break ;;
            esac
            sleep 2
          done
          echo "::error::the container never reported healthy"
          docker logs drillion
          exit 1
      - run: docker exec drillion drillion selfcheck
      # selfcheck never opens /lsp, so nothing else here would notice a language server that
      # cannot start — which is exactly what trimming the image could break
      - name: the editor's language server answers on /lsp
        run: |
          docker exec -i drillion python - <<'PY'
          import json
          from websockets.sync.client import connect

          # the origin the page itself would send; api._allowed_origins() refuses any other
          with connect("ws://127.0.0.1:8765/lsp", origin="http://127.0.0.1:8765") as ws:
              ws.send(json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                                  "params": {"processId": None, "rootUri": None,
                                             "capabilities": {}}}))
              for _ in range(50):  # the server logs a few notifications before it answers
                  reply = json.loads(ws.recv(timeout=120))
                  if reply.get("id") == 1:
                      break
              else:
                  raise SystemExit("::error::no reply to the LSP initialize")
          assert "capabilities" in reply.get("result", {}), reply
          print("lsp initialize ok:", reply["result"].get("serverInfo"))
          PY
      - name: start it again with nothing but a volume
        run: |
          docker rm -f drillion
          docker run -d --name seeded -v drillion-data:/data -p 127.0.0.1:8765:8765 drillion:ci
          for _ in $(seq 30); do
            case "$(docker inspect -f '{{.State.Health.Status}}' seeded)" in
              healthy) break ;;
              unhealthy) docker logs seeded; exit 1 ;;
            esac
            sleep 2
          done
          test "$(curl -fsS http://127.0.0.1:8765/api/health | jq .tasks)" = 182
          curl -fsS -o /dev/null http://127.0.0.1:8765/
          curl -fsS -o /dev/null -X POST http://127.0.0.1:8765/api/task/009_fstrings/open

  # the single context branch protection requires: one name that survives the matrix
  # growing a cell or a job being renamed, so the ruleset never goes stale again
  gate:
    if: always()
    # `changes` is in here so that a filter that fails takes the gate down with it, rather than
    # skipping every job below it and reporting a green nobody earned
    needs: [changes, check, web, screens, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: nothing above failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          # `skipped` is a pass now, and it has to be: the jobs above are skipped deliberately on
          # a documentation-only change, and a required check that goes red for that would block
          # every prose PR. None of them has any other `needs`, so the only thing that can skip
          # one is the `if:` written above it -- revisit this if that stops being true.
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac

  # a cron nobody watches is worth little to a solo maintainer: turn a red nightly into one
  # issue that gets refreshed on each further failure, instead of a run nobody opens
  report:
    if: github.event_name == 'schedule' && failure()
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: file or refresh the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LABEL: nightly-failure
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # the label is the dedupe key. It is an exact match that survives somebody retitling
          # the issue, where a title phrase is full text and stops matching the moment it is
          # edited -- and one missed match is an issue per night, which is the pile this job
          # exists to prevent. `--force` makes the create idempotent, so the label never has to
          # exist by hand first. Author stays in the lookup so a person who reaches for the same
          # label never has their own issue's body overwritten by the bot.
          gh label create "$LABEL" -R "$REPO" --force \
            -c B60205 -d "a scheduled ci.yml run failed"
          ISSUE=$(gh issue list -R "$REPO" --state open -A "github-actions[bot]" \
            -l "$LABEL" --json number -q '.[0].number')
          if [ -z "$ISSUE" ]; then
            gh issue create -R "$REPO" -t "nightly CI run failed" -l "$LABEL" \
              -b "The scheduled run of ci.yml failed: $RUN_URL"
          else
            gh issue edit -R "$REPO" "$ISSUE" -b "The scheduled run of ci.yml failed again: $RUN_URL"
          fi
