name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # nightly: the 14 tasks that import boto3, moto, requests, responses, langchain-core,
    # fastapi and httpx at grade time can break on an upstream release with no commit landing
    # here to trigger CI. Offset from security.yml (17 6 * * 1) and scorecard.yml (41 6 * * 1),
    # and off the hour, where GitHub's scheduler is congested and runs get delayed.
    - cron: "37 3 * * *"

permissions:
  contents: read

concurrency:
  # github.ref is the same default-branch ref for a push to main and every scheduled run, so
  # without this a nightly run and a just-landed push could cancel each other out
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

jobs:
  # Unknown paths and unavailable diffs run everything. A metadata-only edit is
  # still packaged and checked against the user-facing documentation contract.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.f.outputs.docs }}
      film: ${{ steps.f.outputs.film }}
      check: ${{ steps.f.outputs.check }}
      web: ${{ steps.f.outputs.web }}
      screens: ${{ steps.f.outputs.screens }}
      image: ${{ steps.f.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # both ends of the diff have to be in the clone
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 .github/scripts/ci-changes.py

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.check != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/test_ci.py -q -k user_docs_describe_docker_as_the_only_distribution
      - run: uv build --sdist -o /tmp/sdist

  # The README film is excluded from the product wheel and Docker image. Check its
  # source without launching Python graders, browsers or an image build.
  film:
    needs: changes
    if: needs.changes.outputs.film == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check docs/film
      - run: uv run ruff format --check docs/film
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      # The film lockfile uses the same pnpm version pinned by the client.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: docs/film
      - run: pnpm typecheck
        working-directory: docs/film
      - run: node --check encode.mjs
        working-directory: docs/film

  # Linux only: drillion ships as a Linux image, so no other OS runs it
  check:
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
        if: github.event_name != 'schedule'
      # --locked pins every package to the lockfile, so a push or PR run install the exact
      # same versions every time; that's reproducible, but it's also blind to the upstream
      # release that broke a task overnight, which is the entire point of running this nightly
      - name: resolve today's allowed versions instead of the lockfile
        if: github.event_name == 'schedule'
        run: uv lock --upgrade && uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Manifest and Helm tasks are graded by pinned external tools, and both the grader
      # tests and `selfcheck` run them for real, so they have to be here before either.
      # The download is checksum-pinned; an unpinned or altered one is refused rather
      # than installed.
      - run: uv run drillion doctor --fetch
      # Git task tests spawn many short-lived git processes. On PRs and main pushes,
      # put them on their own runner so slow filesystem runs do not hold up this suite.
      - run: uv run pytest tests -q -n auto --durations=20 --ignore=tests/test_git_tasks.py
        if: github.event_name != 'schedule'
      # Keep the nightly upgrade test in one environment after uv lock --upgrade.
      - run: uv run pytest tests -q -n auto --durations=20
        if: github.event_name == 'schedule'
      # The installed image runs the full catalogue selfcheck below. Keep the checkout
      # variant on the nightly run to catch differences in the dev environment.
      - run: uv run drillion selfcheck
        if: github.event_name == 'schedule'

  git-tests:
    needs: changes
    if: needs.changes.outputs.check == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/test_git_tasks.py -q -n auto --durations=20

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      # node 26 ships no corepack; this reads the same packageManager pin corepack would
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - name: locate the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path)" >> "$GITHUB_ENV"
        working-directory: web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
      # the only build of web/dist in CI: screens downloads this instead of rebuilding it,
      # and the image job builds its own inside the Dockerfile, which is a separate concern
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist/
      # after pnpm install, with node_modules on disk: the only state the sdist exclude list can fail in
      - run: uv build --sdist -o /tmp/sdist
      - name: the sdist carries the source, not the workspace
        run: |
          python3 - <<'PY'
          import glob, pathlib, sys, tarfile
          names = [m.name for m in tarfile.open(glob.glob("/tmp/sdist/*.tar.gz")[0]).getmembers()]
          banned = [n for n in names
                    if any(b in n for b in ("node_modules", ".tsbuildinfo", "/screenshots/",
                                            "/test-results/", "/.vscode/", "/.idea/"))]
          if banned:
              print(f"::error::the sdist contains {len(banned)} files it should not, e.g. {banned[:3]}")
              sys.exit(1)
          tasks = {n.split("/")[2] for n in names if "/tasks/" in n and n.count("/") > 2}
          # counted from the checkout rather than written down: a number here goes stale the
          # first time somebody adds a task, and fails their PR instead of the packaging
          want = {p.parent.name for p in pathlib.Path("../tasks").glob("*/task.py")}
          if missing := want - tasks:
              print(f"::error::the sdist is missing {len(missing)} task folders, e.g. {sorted(missing)[:3]}")
              sys.exit(1)
          if not any("/web/dist/" in n for n in names):
              print("::error::the sdist has no web/dist, so a wheel built from it serves no page")
              sys.exit(1)
          print(f"sdist ok: {len(names)} entries, {len(tasks)} tasks, web/dist present")
          PY
        working-directory: web

  # Each leg owns its server. Chromium's required tests run in two isolated shards
  # within one leg; the tagged capture tour remains available for explicit review.
  screens:
    # web is the only build of web/dist; this job downloads it rather than building its own
    needs: [changes, web]
    if: needs.changes.outputs.screens == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - engines: chromium
          # every task page, one navigation each: the longest single spec, so it gets a leg
          - engines: chromium-render
            projects: --project=chromium --grep=@render
          - engines: firefox-webkit
            projects: --project=firefox --project=webkit
    name: screens (${{ matrix.engines }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # this image tag and web/package.json's @playwright/test pin are one version, bumped together
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      # node 26 ships no corepack; this reads the same packageManager pin corepack would
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - name: locate the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path)" >> "$GITHUB_ENV"
        working-directory: web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-
      # node_modules still has to be real: playwright and axe-core run from here, only the
      # built bundle they serve comes from the `web` job instead of a second `pnpm build`
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - run: bash ../.github/scripts/screens-chromium.sh
        if: matrix.engines == 'chromium'
        working-directory: web
      - run: pnpm screens $PROJECTS # unquoted: one flag per project
        if: matrix.engines == 'chromium-render'
        working-directory: web
        env:
          PROJECTS: ${{ matrix.projects }}
      - run: bash ../.github/scripts/screens-multiengine.sh
        if: matrix.engines == 'firefox-webkit'
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: client-traces-${{ matrix.engines }}
          path: web/test-results/

  # builds the image once and is the only place that does. Everything that needs the built
  # image -- the smoke tests below and the vulnerability scan that used to live in
  # security.yml -- hangs off this one build, because two workflows each spending a minute
  # building the same Dockerfile from the same commit bought nothing but a second copy.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # the scan below publishes to code scanning
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: drillion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Refresh Debian on the nightly run. PRs reuse runtime layers; the release
          # build still refreshes its own runtime before publishing an image.
          no-cache-filters: ${{ github.event_name == 'schedule' && 'runtime' || '' }}

      # Both consumers use the loaded image on this runner. Collect smoke's status
      # after publishing scan reports, so a failing smoke test cannot swallow SARIF.
      - name: start image smoke tests
        id: smoke
        run: |
          nohup bash -c '
            status=0
            bash .github/scripts/image-smoke.sh || status=$?
            echo "$status" > "$RUNNER_TEMP/image-smoke.status"
          ' > "$RUNNER_TEMP/image-smoke.log" 2>&1 < /dev/null &
          echo "pid=$!" >> "$GITHUB_OUTPUT"

      # Keep vulnerability AND secret scanning, all severities, and reporting-only findings.
      - name: scan the image we would publish
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: drillion:ci
          scanners: vuln,secret
          ignore-unfixed: true
          format: json
          output: trivy-image.json
          exit-code: 0
      - name: convert the image scan to SARIF
        id: sarif
        run: trivy convert --format sarif --output trivy-image.sarif trivy-image.json
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: ${{ !cancelled() && steps.sarif.outcome == 'success' }}
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: the fixable CRITICAL and HIGH in the image today
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        run: trivy convert --format table --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 0 trivy-image.json

      - name: collect image smoke tests
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SMOKE_PID: ${{ steps.smoke.outputs.pid }}
        run: |
          trap 'cat "$RUNNER_TEMP/image-smoke.log"' EXIT
          while [ ! -s "$RUNNER_TEMP/image-smoke.status" ]; do
            if ! kill -0 "$SMOKE_PID" 2>/dev/null; then
              echo "::error::image smoke tests exited without a result"
              exit 1
            fi
            sleep 1
          done
          exit "$(cat "$RUNNER_TEMP/image-smoke.status")"

  # the single context branch protection requires: one name that survives the matrix
  # growing a cell or a job being renamed, so the ruleset never goes stale again
  gate:
    if: always()
    # `changes` is in here so that a filter that fails takes the gate down with it, rather than
    # skipping every job below it and reporting a green nobody earned
    needs: [changes, docs, film, check, git-tests, web, screens, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: nothing above failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          # `skipped` passes only because every path is selected by `changes` above.
          # A failed prerequisite also appears here as failure and takes the gate down.
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac

  # a cron nobody watches is worth little to a solo maintainer: turn a red nightly into one
  # issue that gets refreshed on each further failure, instead of a run nobody opens
  report:
    if: github.event_name == 'schedule' && failure()
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: file or refresh the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LABEL: nightly-failure
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # the label is the dedupe key. It is an exact match that survives somebody retitling
          # the issue, where a title phrase is full text and stops matching the moment it is
          # edited -- and one missed match is an issue per night, which is the pile this job
          # exists to prevent. `--force` makes the create idempotent, so the label never has to
          # exist by hand first. Author stays in the lookup so a person who reaches for the same
          # label never has their own issue's body overwritten by the bot.
          gh label create "$LABEL" -R "$REPO" --force \
            -c B60205 -d "a scheduled ci.yml run failed"
          ISSUE=$(gh issue list -R "$REPO" --state open -A "github-actions[bot]" \
            -l "$LABEL" --json number -q '.[0].number')
          if [ -z "$ISSUE" ]; then
            gh issue create -R "$REPO" -t "nightly CI run failed" -l "$LABEL" \
              -b "The scheduled run of ci.yml failed: $RUN_URL"
          else
            gh issue edit -R "$REPO" "$ISSUE" -b "The scheduled run of ci.yml failed again: $RUN_URL"
          fi
