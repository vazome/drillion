name: Claude Code Review

# Claude skips a PR that changes this workflow until the change reaches main.
# Fork and Dependabot PRs get no secrets, so they are skipped, not failed.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - id: review
        env:
          # a background subagent is lost when the run ends its turn waiting for it
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          # temporary: shows why a review posts nothing; turn off once it is understood
          show_full_output: true
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: --allowedTools "Skill,Agent,Read,Glob,Grep,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"

      - name: Check review permissions
        if: steps.review.outputs.execution_file != ''
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          denied="$(jq -r '.[] | select(.type == "result") | .permission_denials[]?.tool_name' "$CLAUDE_EXECUTION_FILE")"
          if [ -n "$denied" ]; then
            echo "::error::Claude review was denied: $(echo "$denied" | sort -u | paste -sd, -); add it to the tool allowlist."
            exit 1
          fi
