name: release

run-name: "release: ${{ github.ref_name }}"

on:
  push:
    tags: ["v*"]
  # rerun a half-finished release by dispatching this workflow on the same tag, so moving the tag
  # is never the retry. Every job below reads the tag from the ref, so both paths are identical.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # everything downstream publishes something irreversible, so this is the only place that decides
  # whether this commit may be published at all
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # merge-base below needs main's history; a shallow clone answers it wrong
          fetch-depth: 0
      - name: this must run on a v* tag
        run: |
          case "${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" in
            tag:v*) ;;
            *)
              echo "::error::release runs on a v* tag, not $GITHUB_REF_TYPE $GITHUB_REF_NAME"
              exit 1
              ;;
          esac
      - name: the tag must be v<the version in pyproject.toml>
        run: |
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME#v}" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with pyproject.toml version $declared"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches the declared version"
      # a tag can point at any commit, and no ruleset constrains tags. The `main` ruleset requires
      # `check` and `image`, so being on main is the proof that this commit went green.
      - name: the tagged commit must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main, so nothing has proved it green"
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

  image:
    needs: gate
    runs-on: ubuntu-latest
    # v0.4.0 built and pushed amd64 alone in 61s. The arm64 half below runs under QEMU on an
    # amd64 runner, so the ceiling is emulation, not the build. If a release ever approaches this,
    # issue #128's other route — native ubuntu-24.04-arm builds merged with `buildx imagetools
    # create` — is the fix.
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # binfmt handlers for the arm64 half; hosted runners carry none
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=pep440,pattern={{version}}
          # Stable releases receive `latest`; pre-releases stay version-addressable only.
          flavor: latest=auto
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # the README sells Docker as the path that needs nothing else, and on Apple Silicon that
          # path was QEMU emulating pytest on every graded submission
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # on, and BuildKit pushes a second unsigned provenance wrapped in an index, which
          # shows on the package page as a phantom unknown/unknown architecture. The index the
          # two platforms above produce is the genuine kind and lists exactly those two.
          provenance: false
      # multi-platform makes this an index digest, which is the right subject: `gh attestation
      # verify oci://…:<tag>` resolves a tag with `remote.Get`, so it asks about the index, not
      # either child. Attesting a child instead would verify for nobody.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # Provenance above describes the multi-platform index. An SBOM describes a filesystem, so
      # resolve each Linux manifest and attest its own inventory rather than claiming the amd64
      # runner's scan represents arm64 too.
      - id: platform-digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          index="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          for arch in amd64 arm64; do
            digest="$(jq -er --arg arch "$arch" '
              .manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest
            ' <<<"$index")"
            echo "${arch}=${digest}" >> "$GITHUB_OUTPUT"
          done
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.platform-digests.outputs.amd64 }}
          format: spdx-json
          output: sbom-amd64.spdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.platform-digests.outputs.amd64 }}
          sbom-path: sbom-amd64.spdx.json
          push-to-registry: true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.platform-digests.outputs.arm64 }}
          format: spdx-json
          output: sbom-arm64.spdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.platform-digests.outputs.arm64 }}
          sbom-path: sbom-arm64.spdx.json
          push-to-registry: true

  # the image is public the moment the job above finishes; record what we shipped, in the release's
  # own summary. Reports only — a release cannot be un-published by failing here.
  image-scan:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: table
          output: trivy-release.txt
          exit-code: 0
      - run: '{ echo "### fixable CRITICAL/HIGH in ${GITHUB_REF_NAME}"; echo "```"; cat trivy-release.txt; echo "```"; } >> "$GITHUB_STEP_SUMMARY"'

  # The release notes are the changelog section plus the immutable image reference. The GHCR image
  # is the only learner-facing artifact; the GitHub Release remains its human-readable record.
  notes:
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v pat="^## ${version} " '/^## / && p {exit} p; $0 ~ pat {p=1}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          {
            echo
            echo '## Container image'
            echo
            echo "\`ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}\`"
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "drillion $version" --notes-file notes.md --latest
