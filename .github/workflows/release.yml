name: release

run-name: "release: ${{ github.ref_name }}"

on:
  push:
    tags: ["v*"]
  # rerun a half-finished release by dispatching this workflow on the same tag, so moving the tag
  # is never the retry. Every job below reads the tag from the ref, so both paths are identical,
  # and a version whose image is already out keeps its digest rather than being rebuilt.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # everything downstream publishes something irreversible, so this is the only place that decides
  # whether this commit may be published at all
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      published: ${{ steps.published.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # merge-base below needs main's history; a shallow clone answers it wrong
          fetch-depth: 0
      - name: this must run on a v* tag
        run: |
          case "${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" in
            tag:v*) ;;
            *)
              echo "::error::release runs on a v* tag, not $GITHUB_REF_TYPE $GITHUB_REF_NAME"
              exit 1
              ;;
          esac
      - name: the tag must be v<the version in pyproject.toml>
        run: |
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME#v}" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with pyproject.toml version $declared"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches the declared version"
      # a tag can point at any commit, and no ruleset constrains tags. The `main` ruleset requires
      # only `gate`, so being on main is the proof that this commit went green.
      - name: the tagged commit must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main, so nothing has proved it green"
            exit 1
          fi
          echo "$GITHUB_SHA is on main"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A version tag is immutable. A retry of a release whose image already went out reuses
      # that digest instead of rebuilding: the Dockerfile upgrades apt packages live, so a
      # rebuild would push different bytes under the same version.
      - id: published
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}"
          if manifest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null)"; then
            digest="$(jq -er .digest <<<"$manifest")"
            echo "::notice::$ref is already published as $digest; reusing it"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi

  # One native runner per platform. arm64 under QEMU on an amd64 runner took most of a
  # 10-minute release, the bulk of it emulating `doctor` over the whole task catalogue. Each
  # leg pushes its image by digest alone; `image` joins the two into the one tagged index.
  build:
    needs: gate
    if: needs.gate.outputs.published == ''
    strategy:
      matrix:
        include:
          # ci.yml's image job writes the default `buildkit` scope from main, which a tag run
          # may read, so the amd64 leg starts warm. Nothing on main builds arm64.
          - arch: amd64
            runner: ubuntu-latest
            cache: buildkit
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # the README sells Docker as the path that needs nothing else, and on Apple Silicon that
          # path was QEMU emulating pytest on every graded submission
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache }}
          # same layer skipped as ci.yml's image job: the runtime stage upgrades its Debian
          # packages live, and a cached layer never re-runs that, so a release built from stale
          # cache would ship whatever package set the last cache write happened to catch.
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
          no-cache-filters: runtime
          # on, and BuildKit pushes a second unsigned provenance wrapped in an index, which
          # shows on the package page as a phantom unknown/unknown architecture. The index
          # `image` creates is the genuine kind and lists exactly the two platforms.
          provenance: false
      - env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir digests && touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    needs: [gate, build]
    # `build` is skipped when the gate found this version already published
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.digest.outputs.value }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=pep440,pattern={{version}}
          # Stable releases receive `latest`; pre-releases stay version-addressable only.
          flavor: latest=auto
      - if: needs.gate.outputs.published == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - id: digest
        env:
          PUBLISHED: ${{ needs.gate.outputs.published }}
          IMAGE: ghcr.io/${{ github.repository }}
          METADATA: ${{ steps.meta.outputs.json }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          if [ -n "$PUBLISHED" ]; then
            echo "value=$PUBLISHED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t tags < <(jq -r '.tags[] | ("-t", .)' <<<"$METADATA")
          sources=()
          for f in digests/*; do sources+=("${IMAGE}@sha256:${f##*/}"); done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -er .digest)"
          echo "value=$digest" >> "$GITHUB_OUTPUT"
      # multi-platform makes this an index digest, which is the right subject: `gh attestation
      # verify oci://…:<tag>` resolves a tag with `remote.Get`, so it asks about the index, not
      # either child. Attesting a child instead would verify for nobody.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true

  # Provenance above describes the multi-platform index. An SBOM describes a filesystem, so each
  # Linux manifest is resolved and attested with its own inventory rather than claiming the amd64
  # runner's scan represents arm64 too.
  sbom:
    needs: image
    # `build` is skipped on a rerun of a published version, and a skip propagates through
    # every job below it unless each one says otherwise
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: platform
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          digest="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" | jq -er --arg arch "$ARCH" '
            .manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest
          ')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.platform.outputs.digest }}
          format: spdx-json
          output: sbom.spdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.platform.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  # the image is public the moment the job above finishes; record what we shipped, in the release's
  # own summary. Reports only — a release cannot be un-published by failing here.
  image-scan:
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: table
          output: trivy-release.txt
          exit-code: 0
      - run: '{ echo "### fixable CRITICAL/HIGH in ${GITHUB_REF_NAME}"; echo "```"; cat trivy-release.txt; echo "```"; } >> "$GITHUB_STEP_SUMMARY"'

  # The release notes are the changelog section plus the immutable image reference. The GHCR image
  # is the only learner-facing artifact; the GitHub Release remains its human-readable record.
  notes:
    needs: [image, sbom]
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.sbom.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v pat="^## ${version} " '/^## / && p {exit} p; $0 ~ pat {p=1}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY}"
          {
            echo
            echo '## Container image'
            echo
            echo "\`${image}@${DIGEST}\`"
            echo
            echo 'Platforms: `linux/amd64`, `linux/arm64`.'
            echo
            echo 'Upgrade to this release, or roll back to it, keeping the `drillion` data volume:'
            echo
            echo '```bash'
            echo "docker pull ${image}@${DIGEST}"
            echo 'docker stop drillion && docker rm drillion'
            echo "docker run -d --name drillion --restart unless-stopped -p 127.0.0.1:8765:8765 -v drillion:/data ${image}@${DIGEST}"
            echo '```'
            echo
            echo 'Verify its provenance:'
            echo
            echo '```bash'
            echo "gh attestation verify oci://${image}@${DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "drillion $version" --notes-file notes.md --latest
