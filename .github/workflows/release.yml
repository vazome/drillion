name: release

on:
  push:
    tags: ["v*"]
  # rerun a half-finished release by dispatching this workflow on the same tag, so moving the tag
  # is never the retry. Every job below reads the tag from the ref, so both paths are identical.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # everything downstream publishes something irreversible, so this is the only place that decides
  # whether this commit may be published at all
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # merge-base below needs main's history; a shallow clone answers it wrong
          fetch-depth: 0
      - name: this must run on a v* tag
        run: |
          case "${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" in
            tag:v*) ;;
            *)
              echo "::error::release runs on a v* tag, not $GITHUB_REF_TYPE $GITHUB_REF_NAME"
              exit 1
              ;;
          esac
      - name: the tag must be v<the version in pyproject.toml>
        run: |
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME#v}" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with pyproject.toml version $declared"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches the declared version"
      # a tag can point at any commit, and no ruleset constrains tags. The `main` ruleset requires
      # `check` and `image`, so being on main is the proof that this commit went green.
      - name: the tagged commit must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main, so nothing has proved it green"
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

  image:
    needs: gate
    runs-on: ubuntu-latest
    # v0.4.0 built and pushed amd64 alone in 61s. The arm64 half below runs under QEMU on an
    # amd64 runner, so the ceiling is emulation, not the build. If a release ever approaches this,
    # issue #128's other route — native ubuntu-24.04-arm builds merged with `buildx imagetools
    # create` — is the fix.
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # binfmt handlers for the arm64 half; hosted runners carry none
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=pep440,pattern={{version}}
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # the README sells Docker as the path that needs nothing else, and on Apple Silicon that
          # path was QEMU emulating pytest on every graded submission
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # on, and BuildKit pushes a second unsigned provenance wrapped in an index, which
          # shows on the package page as a phantom unknown/unknown architecture. The index the
          # two platforms above produce is the genuine kind and lists exactly those two.
          provenance: false
      # multi-platform makes this an index digest, which is the right subject: `gh attestation
      # verify oci://…:<tag>` resolves a tag with `remote.Get`, so it asks about the index, not
      # either child. Attesting a child instead would verify for nobody.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # provenance above says where the image came from; this says what is inside it. Read off the
      # pushed digest, so it lists the vendored trees — nodejs_wheel's npm above all — that appear
      # in no manifest we own and that no scanner of ours publishes. Trivy resolves the index to
      # the runner's own arch, so this lists amd64's build of a package set both arches share.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output: sbom.spdx.json
      # `actions/attest` with sbom-path is what `actions/attest-sbom` now forwards to, so this is
      # the same attestation without the deprecated wrapper
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  # the image is public the moment the job above finishes; record what we shipped, in the release's
  # own summary. Reports only — a release cannot be un-published by failing here.
  image-scan:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: table
          output: trivy-release.txt
          exit-code: 0
      - run: '{ echo "### fixable CRITICAL/HIGH in ${GITHUB_REF_NAME}"; echo "```"; cat trivy-release.txt; echo "```"; } >> "$GITHUB_STEP_SUMMARY"'

  # separate from `pypi`: this job runs a third-party npm build and must never hold the PyPI credential
  dists:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dists
          path: dist/

  # PyPI's trusted publisher is scoped to owner/repo + this filename + the `pypi` environment;
  # renaming any of the three stops releases until PyPI is updated to match
  pypi:
    needs: dists
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/drillion
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # the release notes are the changelog section for this tag: one hand-written source, so a
  # published release can never drift from what shipped. The same wheel and sdist `pypi` uploaded
  # are attached, so the release is checkable without trusting the index.
  notes:
    needs: [pypi, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dists
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v pat="^## ${version} " '/^## / && p {exit} p; $0 ~ pat {p=1}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "drillion $version" --notes-file notes.md --latest
