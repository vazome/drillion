name: scorecard

# separate from `security`: Scorecard scores the repository, not a commit, so it cannot run on a
# pull request — it needs the default branch and an OIDC identity to publish under.
on:
  push:
    branches: [main]
  # the score moves when the rules do, and Branch-Protection is one of the checks
  branch_protection_rule:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # the workflow-run history the Actions-based checks read
      actions: read
      security-events: write
      # publish_results signs the score to the OpenSSF API with an OIDC token; the badge reads that
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: scorecard.sarif
          category: scorecard
