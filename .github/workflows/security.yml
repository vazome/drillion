name: security

# the image is scanned in ci.yml, not here: it is built there for the smoke tests, and one
# build feeding both beats two workflows building the same Dockerfile a minute apart. That
# also moves the image scan from this weekly cron onto ci.yml's nightly one.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # the vulnerability database moves under commits that never change, so re-scan on a clock
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # what Dependabot already watches, plus the misconfiguration checks it has no opinion on
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # scanned once each, to JSON. `trivy convert` then re-reads that JSON to produce both the
      # SARIF and the gate below, so the tree is walked twice here rather than the four times it
      # took when every output meant another scan. `ignore-unfixed` has to live on the scan --
      # `convert` has no such flag -- while `severity` is a convert flag, which is what lets the
      # SARIF carry every severity while the gate looks only at the ones that stop a merge.
      - name: scan the lockfiles and the source tree
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # secrets are GitHub's own push protection to catch; this scan is about dependencies
          scanners: vuln
          ignore-unfixed: true
          format: json
          output: trivy-fs.json
          exit-code: 0
      # setup-trivy above puts the binary on PATH, so every `trivy` below is the same version
      - run: trivy convert --format sarif --output trivy-fs.sarif trivy-fs.json
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-fs.sarif
          # distinct per scan: code scanning replaces an upload with the next one in the same category
          category: trivy-fs

      # Dockerfile only in practice: measured on Trivy 0.71.2, a deliberately unsafe workflow
      # produced no finding even with --misconfig-scanners github
      - name: scan the Dockerfile for misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: json
          output: trivy-config.json
          exit-code: 0
          skip-setup-trivy: true
      - run: trivy convert --format sarif --output trivy-config.sarif trivy-config.json
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      # the gates come after both uploads, so a red build still leaves the findings in the Security tab
      - name: fail on a fixable CRITICAL or HIGH dependency
        run: trivy convert --severity CRITICAL,HIGH --exit-code 1 trivy-fs.json
      - name: fail on a CRITICAL or HIGH misconfiguration
        run: trivy convert --severity CRITICAL,HIGH --exit-code 1 trivy-config.json

  # the workflows themselves: the surface Trivy's config scan has no rules for
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # gates: the workflows carry no findings today, so any new one fails this job. The upload
      # below still runs on that failure, so a red build leaves the findings in the Security tab.
      - name: audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.29.0 --format sarif --no-progress .github/workflows/ > zizmor.sarif
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: ${{ !cancelled() }}
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  # Dependabot reports a vulnerable dependency after it lands; this is the same news before the merge
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
