services:
  drillion:
    image: ghcr.io/vazome/drillion:latest
    container_name: drillion
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      # a named volume, not a bind mount: the container runs as uid 1000 and a host
      # directory Docker creates belongs to root
      - drillion:/data

volumes:
  drillion:
