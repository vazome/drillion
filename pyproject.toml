[project]
name = "drillion"
version = "0.1.0"
description = "Spaced-repetition Python drills: pytest-graded exercises on a Leitner ladder, in a browser"
readme = "README.md"
requires-python = ">=3.13"
# runtime, not dev: the app serves the API (fastapi/uvicorn), reads each drill's
# README frontmatter (pyyaml), grades in a pytest subprocess (pytest,
# pytest-timeout), and the drills themselves import the rest.
dependencies = [
    "boto3>=1.43.69",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.5.4",
    "moto>=5.2.2",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "responses>=0.26.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
drillion = "drillion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drillion"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest-watcher>=0.6.3",
    "ruff>=0.16.2",
]

[tool.ruff]
extend-exclude = ["drafts"]          # scratch files, not part of the drill set

[tool.ruff.lint.per-file-ignores]
"src/drillion/*" = ["DTZ"]  # local wall-clock dates are intended for scheduling
"exercises/*/drill.py" = ["E402", "F841"]  # the region is the learner's, and the
# machinery imports below the marker are deliberately not at the top of the file

[tool.pytest.ini_options]
python_files = ["drill.py", "test_*.py"]
testpaths = ["tests", "exercises"]
pythonpath = ["exercises"]           # every drill does `from _lib import rng`
# every drill file is called drill.py, so modules are named by path, not by basename
addopts = "--import-mode=importlib"
