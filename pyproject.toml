[project]
name = "drillion"
version = "0.4.6"
description = "Python practice drills that come back before you forget them. Graded by pytest, runs on your machine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
# the same eight words the repo's GitHub topics use; keep the two lists identical
keywords = [
    "education",
    "exercism",
    "learning",
    "leitner-system",
    "pytest",
    "python",
    "self-hosted",
    "spaced-repetition",
]
# every string is an exact line of https://pypi.org/pypi?%3Aaction=list_classifiers —
# an invalid one is a hard upload rejection. A Python version here claims CI tests it.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education :: Computer Aided Instruction (CAI)",
]
# 14 tasks import boto3, moto, langchain-core, requests, responses and httpx, and run in
# the app's own interpreter — an extras group would ship tasks that fail at import
dependencies = [
    "basedpyright>=1.39.10",
    "boto3>=1.43.69",
    "boto3-stubs[ec2,s3]>=1.43.81",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.5.4",
    "moto>=5.2.2",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "responses>=0.26.2",
    "uvicorn[standard]>=0.52.4",
]

[project.urls]
Homepage = "https://github.com/vazome/drillion"
Source = "https://github.com/vazome/drillion"
Changelog = "https://github.com/vazome/drillion/blob/main/CHANGELOG.md"
Issues = "https://github.com/vazome/drillion/issues"

[project.scripts]
drillion = "drillion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drillion"]

# both sources must exist at build time; web/dist/.gitkeep is committed for that reason
[tool.hatch.build.targets.wheel.force-include]
"tasks" = "drillion/_tasks"
"web/dist" = "drillion/_web"

[tool.hatch.build.targets.sdist]
# web/dist is git-ignored, and `artifacts` is the one selector the VCS rules do not apply to
artifacts = ["web/dist/**"]
# hatchling reads only the root .gitignore, so every web/ ignore is repeated here
exclude = [
    "/.idea",
    "/.vscode",
    "/.design-sync",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/DESIGN.md",
    "/web/node_modules",
    "/web/screenshots",
    # the README points at these by URL; they never need to ship inside the package
    "/docs/images",
    "/web/test-results",
    "*.tsbuildinfo",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest-watcher>=0.6.3",
    "ruff>=0.16.2",
]

[tool.ruff]
extend-exclude = ["drafts"]

[tool.ruff.format]
# a learner region's shape is the exercise; never reformat the task files
exclude = ["tasks/**", "*.md"]

[tool.ruff.lint.per-file-ignores]
# scheduling runs on local wall-clock dates on purpose; a tz-aware fix shifts every due date
"src/drillion/*" = ["DTZ"]
"tasks/*/task.py" = ["E402", "F841"]

[tool.pytest.ini_options]
python_files = ["task.py", "test_*.py"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
# a dependency announces a breaking change as a warning a release before it lands; under
# -q nobody reads it, so make it fail instead. Learner submissions never see this config —
# runner._run_pytest pins its own (empty) one.
filterwarnings = [
    "error",
    # that one message only, so starlette's next deprecation still stops the build; dies
    # when we move off httpx 0.28 + TestClient, which starlette is asking us to
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

# aimed at src/ only. `tasks/` is untyped on purpose, and the learner's editor resolves its
# own config from `settings.tasks_dir` — see tests/test_lsp.py, which holds that line.
[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
