[project]
name = "drillion"
version = "0.1.1"
description = "Python practice drills that come back before you forget them. Graded by pytest, runs on your machine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
# runtime, not dev: the app serves the API (fastapi/uvicorn), reads each task's
# README frontmatter (pyyaml), grades in a pytest subprocess (pytest,
# pytest-timeout), and the tasks themselves import the rest.
dependencies = [
    "boto3>=1.43.69",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.5.4",
    "moto>=5.2.2",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "responses>=0.26.2",
    "uvicorn>=0.52.4",
]

[project.urls]
Homepage = "https://github.com/vazome/drillion"
Issues = "https://github.com/vazome/drillion/issues"

[project.scripts]
drillion = "drillion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drillion"]

# The wheel has to carry the content or `uvx drillion` installs a CLI with an empty
# catalogue and no page to serve (#38). `tasks/` goes in as a pristine template that
# `cli.seed()` copies into a writable root on the first run — a task file is where the
# learner's code is stored, so it can never be practised inside site-packages. Both
# sources must exist at build time: hatchling errors on a forced include that is
# missing, which is why web/dist/.gitkeep is committed.
[tool.hatch.build.targets.wheel.force-include]
"tasks" = "drillion/_tasks"
"web/dist" = "drillion/_web"

[tool.hatch.build.targets.sdist]
# A bare `uv build` builds the sdist first and then the wheel *from it*, so anything the
# sdist drops the wheel cannot force-include. web/dist is generated and git-ignored, and
# `artifacts` is the one selector the VCS rules do not apply to.
artifacts = ["web/dist/**"]
# The sdist is the source, not the workspace: agent instructions, IDE settings and build
# output are not part of what anyone builds or reads on PyPI.
#
# Every `/web/` line here is already in `web/.gitignore`, and has to be repeated because
# hatchling reads only the ROOT .gitignore — a nested one is invisible to it. Nothing warns
# you: the sdist is correct until someone runs `pnpm install` before `uv build`, which is
# exactly what CI does, so it built clean locally and shipped 113 MB of node_modules in
# drillion 0.1.0. Anything ignored under `web/` must be named again here.
exclude = [
    "/.idea",
    "/.vscode",
    "/.design-sync",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/DESIGN.md",
    "/web/node_modules",
    "/web/screenshots",
    "/web/test-results",
    "/web/.check.bundle.mjs",
    "*.tsbuildinfo",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest-watcher>=0.6.3",
    "ruff>=0.16.2",
]

[tool.ruff]
extend-exclude = ["drafts"]          # scratch files, not part of the task set

[tool.ruff.format]
# Linted, never reshaped. A task file's learner region is the shape the exercise
# teaches, and the Python inside our Markdown is written to be read, not to be
# black-compatible. Both still go through `ruff check`.
exclude = ["tasks/**", "*.md"]

[tool.ruff.lint.per-file-ignores]
"src/drillion/*" = ["DTZ"]  # local wall-clock dates are intended for scheduling
"tasks/*/task.py" = ["E402", "F841"]  # the region is the learner's, and the
# machinery imports below the marker are deliberately not at the top of the file

[tool.pytest.ini_options]
python_files = ["task.py", "test_*.py"]
testpaths = ["tests", "tasks"]
pythonpath = ["tasks"]               # every task does `from _lib import rng`
# every task file is called task.py, so modules are named by path, not by basename
addopts = "--import-mode=importlib"
