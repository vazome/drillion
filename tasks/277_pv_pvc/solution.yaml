apiVersion: v1
kind: PersistentVolume
metadata:
  name: {name}
spec:
  capacity:
    storage: {capacity}
  accessModes:
    - {accessMode}
  storageClassName: {storageClass}
  hostPath:
    path: /mnt/data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {name}
spec:
  accessModes:
    - {accessMode}
  storageClassName: {storageClass}
  resources:
    requests:
      storage: {capacity}
