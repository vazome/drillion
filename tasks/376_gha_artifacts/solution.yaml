name: package
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: {artifact}
          path: dist/
          retention-days: {days}
  check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: {artifact}
          path: dist/
      - run: pipx run twine check dist/*
