packages: []

# pnpm 11 removed onlyBuiltDependencies and makes a blocked build an error
# (strictDepBuilds), so esbuild's postinstall needs an explicit yes.
allowBuilds:
  esbuild: true

# released under a day before the Monaco 37 bump; safe to drop once pnpm stops asking
minimumReleaseAgeExclude:
  - monaco-languageclient@11.0.2
  - vscode-ws-jsonrpc@4.0.2

# monaco-languageclient replaces monaco-editor with CodinGame's VS Code-API build; a second
# copy of monaco is a runtime assertion failure, not a size problem. Every
# @codingame/monaco-vscode-* package pins the others to an exact version, so bump these two
# with package.json and monaco-languageclient, as one set.
overrides:
  monaco-editor: npm:@codingame/monaco-vscode-editor-api@37.1.0
  # the extension API arrives under the alias `vscode`, which an override keyed on the real
  # package name does not reach
  vscode: npm:@codingame/monaco-vscode-extension-api@37.1.0
